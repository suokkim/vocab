           border-radius: 8px; background: var(--bg); }
  .step svg { width: 100%; height: 100%; display: block; }
  .step path.done { fill: none; stroke: var(--faint); stroke-width: 5;
                     stroke-linecap: round; stroke-linejoin: round; }
  .step path.cur { fill: none; stroke: var(--accent); stroke-width: 6.5;
                    stroke-linecap: round; stroke-linejoin: round; }
  .num { position: absolute; top: 2px; left: 5px; font-size: 11px;

<script>
// 획 하나씩 순서대로 그린다. 길이가 제각각이라 getTotalLength 로 시간을 맞춘다.
function play(card) {
  const paths = card.querySelectorAll('path.s');
  let delay = 0;
  paths.forEach(p => {
    const len = p.getTotalLength();
    const dur = Math.max(0.25, len / 120);        // 긴 획은 더 오래
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    void p.getBoundingClientRect();               // 되감기를 브라우저에 반영
    p.style.transition = `stroke-dashoffset ${dur}s linear ${delay}s`;
    p.style.strokeDashoffset = 0;
    delay += dur + 0.12;
  });
}
document.querySelectorAll('.card').forEach(play);
</script>
